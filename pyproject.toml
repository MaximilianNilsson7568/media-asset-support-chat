[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-asset-support-chat"
version = "0.1.0"
description = "Route media asset questions into a realtime creator support chat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["media_support", "support_service"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
